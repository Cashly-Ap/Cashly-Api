name: cashly

services:
  api:
    image: cashly-api:local
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: cashly-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CASHLY_API_PORT:-8081}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cashly?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci
      SPRING_DATASOURCE_USERNAME: cashly
      SPRING_DATASOURCE_PASSWORD: ${CASHLY_DB_PASSWORD:?Set CASHLY_DB_PASSWORD in the workspace .env}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      JWT_SECRET: ${CASHLY_JWT_SECRET:?Set CASHLY_JWT_SECRET in the workspace .env}
      CORS_ALLOWED_ORIGINS: http://localhost:${CASHLY_APP_PORT:-4201},http://127.0.0.1:${CASHLY_APP_PORT:-4201}
      STORAGE_TYPE: s3
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_ACCESS_KEY: cashly
      STORAGE_S3_SECRET_KEY: ${CASHLY_STORAGE_PASSWORD:?Set CASHLY_STORAGE_PASSWORD in the workspace .env}
      STORAGE_S3_BUCKET: cashly-files
      STORAGE_S3_REGION: us-east-1
    volumes:
      - maven_cache:/root/.m2
    depends_on:
      mysql:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s
    networks:
      cashly:
        aliases:
          - cashly-api-app

  app:
    image: cashly-app:local
    build:
      context: ../Cashly-App
      dockerfile: Dockerfile.local
    container_name: cashly-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CASHLY_APP_PORT:-4201}:4200"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4200"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    networks:
      - cashly

  mysql:
    image: mysql:8.0
    container_name: cashly-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cashly
      MYSQL_USER: cashly
      MYSQL_PASSWORD: ${CASHLY_DB_PASSWORD:?Set CASHLY_DB_PASSWORD in the workspace .env}
      MYSQL_ROOT_PASSWORD: ${CASHLY_DB_ROOT_PASSWORD:?Set CASHLY_DB_ROOT_PASSWORD in the workspace .env}
    ports:
      - "127.0.0.1:${CASHLY_DB_PORT:-3308}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/seeds:/seeds:ro
      - ./db/seed.sql:/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping --silent -h localhost -u root"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - cashly

  minio:
    image: cashly-minio:2025
    build:
      context: .
      dockerfile: Dockerfile.minio
    container_name: cashly-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cashly
      MINIO_ROOT_PASSWORD: ${CASHLY_STORAGE_PASSWORD:?Set CASHLY_STORAGE_PASSWORD in the workspace .env}
    ports:
      - "127.0.0.1:${CASHLY_STORAGE_PORT:-9002}:9000"
      - "127.0.0.1:${CASHLY_STORAGE_CONSOLE_PORT:-9003}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - cashly

  minio-init:
    image: cashly-minio:2025
    container_name: cashly-minio-init
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing local/cashly-files'
    environment:
      MINIO_ROOT_USER: cashly
      MINIO_ROOT_PASSWORD: ${CASHLY_STORAGE_PASSWORD:?Set CASHLY_STORAGE_PASSWORD in the workspace .env}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - cashly

volumes:
  mysql_data:
  minio_data:
  maven_cache:
    external: true
    name: cashly-maven-cache

networks:
  cashly:
    name: cashly-network
