variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"

  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: 1
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"

  SPRING_PROFILES_ACTIVE: "test"

  RAILWAY_SERVICE: "parsun-api"

cache:
  paths:
    - .m2/repository/
    - target/

stages:
  - test
  - build
  - package
  - deploy

.maven_template: &maven_template
  image: maven:3.9.9-amazoncorretto-24
  before_script:
    - mvn --version
    - java --version

.docker_template: &docker_template
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY

test:docker:
  <<: *docker_template
  stage: test
  script:
    - docker build -f Dockerfile.test -t parsun-test:$CI_COMMIT_SHA .
    - docker run --rm
      -v /var/run/docker.sock:/var/run/docker.sock
      -e TESTCONTAINERS_RYUK_DISABLED=true
      parsun-test:$CI_COMMIT_SHA
  after_script:
    - docker rmi parsun-test:$CI_COMMIT_SHA || true
  only:
    - merge_requests
    - main
    - develop

build:compile:
  <<: *maven_template
  stage: build
  script:
    - mvn $MAVEN_CLI_OPTS clean compile -DskipTests
  artifacts:
    paths:
      - target/classes/
    expire_in: 1 hour
  only:
    - merge_requests
    - main
    - develop

package:jar:
  <<: *maven_template
  stage: package
  script:
    - mvn $MAVEN_CLI_OPTS clean package -DskipTests
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 week
  only:
    - main
    - develop
    - tags

package:docker:
  <<: *docker_template
  stage: package
  script:
    - docker build -f Dockerfile -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest
  dependencies:
    - package:jar
  only:
    - main
    - tags

deploy:railway:
  stage: deploy
  image: node:20-slim
  before_script:
    - npm install -g @railway/cli
    - |
      if [ -z "$RAILWAY_API_TOKEN" ]; then
        echo "ERROR: RAILWAY_API_TOKEN is not set in GitLab CI/CD variables"
        exit 1
      fi
  script:
    - chmod +x scripts/railway-deploy.sh
    - sh scripts/railway-deploy.sh
  environment:
    name: production
    url: $RAILWAY_PUBLIC_URL
  when: manual
  only:
    - main
    - tags

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
