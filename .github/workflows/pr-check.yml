name: PR Check

on:
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 24
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '24'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run tests
        run: bash scripts/run-structure-verification.sh final
        env:
          MAVEN_OPTS: -Xmx2g -XX:+UseG1GC
          SCREAMING_PROJECT: cashly-screaming-pr-${{ github.run_id }}-${{ github.run_attempt }}
          SCREAMING_COVERAGE_GATE: 'false'

      - name: Upload Surefire test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ github.run_number }}
          path: target/structure-verification/
          retention-days: 7

      - name: Test Summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: JUnit Test Results
          path: target/structure-verification/**/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Remove isolated verification project
        if: always()
        run: docker compose -p "cashly-screaming-pr-${{ github.run_id }}-${{ github.run_attempt }}" -f compose.screaming-test.yaml down --volumes --remove-orphans
