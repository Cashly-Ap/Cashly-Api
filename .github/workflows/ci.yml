name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 24
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '24'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run tests
        run: bash scripts/run-structure-verification.sh final
        env:
          MAVEN_OPTS: -Xmx2g -XX:+UseG1GC
          SCREAMING_PROJECT: cashly-screaming-ci-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload isolated verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-verification-${{ github.run_id }}
          path: target/structure-verification/
          retention-days: 7

      - name: Remove isolated verification project
        if: always()
        run: docker compose -p "cashly-screaming-ci-${{ github.run_id }}-${{ github.run_attempt }}" -f compose.screaming-test.yaml down --volumes --remove-orphans

      - name: Build Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker build -t cashly-api:${{ github.sha }} .
