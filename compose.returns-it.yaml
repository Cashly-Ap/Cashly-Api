name: cashly-returns-it

services:
  returns-mysql:
    image: mysql:8.0
    container_name: cashly-returns-it-mysql
    environment:
      MYSQL_DATABASE: returns_it
      MYSQL_USER: returns_it
      MYSQL_PASSWORD: returns_it
      MYSQL_ROOT_PASSWORD: returns_it_root
    volumes:
      - returns_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping --silent -h localhost -u root"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - returns-it

  test-runner:
    image: maven:3.9.9-amazoncorretto-24
    profiles:
      - integration
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - returns_target:/workspace/target
      - returns_maven_cache:/root/.m2
    environment:
      RETURNS_MYSQL_URL: jdbc:mysql://returns-mysql:3306/returns_it?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci
      RETURNS_MYSQL_USERNAME: returns_it
      RETURNS_MYSQL_PASSWORD: returns_it
    depends_on:
      returns-mysql:
        condition: service_healthy
    networks:
      - returns-it
    command: ["mvn", "-B", "-Dtest=ReturnsFinancialRollbackMySqlIT", "test"]

volumes:
  returns_mysql_data:
    name: cashly-returns-it-mysql-data
  returns_target:
    name: cashly-returns-it-target
  returns_maven_cache:
    name: cashly-returns-it-maven-cache

networks:
  returns-it:
    name: cashly-returns-it-network
    driver: bridge
