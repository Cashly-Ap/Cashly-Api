# Web Controller test configuration
# Uses H2 in-memory database - no external dependencies needed (works locally and in CI)
# All use cases are @MockBean in controller tests, so the DB is only needed to boot Spring context

spring.datasource.url=jdbc:h2:mem:webtest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration - H2 creates the schema automatically
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.preferred_uuid_jdbc_type=CHAR

# Disable Flyway - H2 manages schema via ddl-auto
spring.flyway.enabled=false

# Logging
logging.level.org.springframework.orm.jpa=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.flywaydb=WARN

# JPA
spring.jpa.open-in-view=false
spring.data.jpa.repositories.enabled=true

# JWT Configuration
jwt.secret=${JWT_SECRET:defaultSecretKeyThatIsAtLeast256BitsLongForHS256AlgorithmSecurity}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# Storage
storage.type=local
storage.location=${java.io.tmpdir}/cashly-web-test-uploads
