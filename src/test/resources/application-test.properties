# Test configuration for Cashly API
# Uses real MySQL database in Docker for integration tests

# Database connection (can be overridden by environment variables in docker-compose)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/cashly_test}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:testuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:testpass}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Enable Flyway for tests to match production behavior
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Logging
logging.level.org.springframework.orm.jpa=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
logging.level.org.springframework.boot.autoconfigure.orm.jpa=INFO
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=ERROR
logging.level.org.flywaydb=INFO

# JPA Repository scanning
spring.data.jpa.repositories.enabled=true

# Ensure proper test configuration
spring.jpa.open-in-view=false

# JWT Configuration (for auth tests)
jwt.secret=${JWT_SECRET:defaultSecretKeyThatIsAtLeast256BitsLongForHS256AlgorithmSecurity}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# H2 Console
spring.h2.console.enabled=true

# Storage Configuration for tests
storage.type=local
storage.location=${java.io.tmpdir}/cashly-test-uploads
