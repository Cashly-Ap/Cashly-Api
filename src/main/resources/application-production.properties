# Production configuration for Railway
server.port=${PORT:8080}

# Database Configuration for AWS RDS (environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/parsundb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:parsunuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration for production
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
# UUID Binary Support - Forces Hibernate to use BINARY(16) for UUID columns
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=BINARY
# Ensure Hibernate treats BINARY(16) as UUID
spring.jpa.properties.hibernate.type.wrapper_array_handling=ALLOW

# Logging configuration
logging.level.com.parsun=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# Security
jwt.secret=${JWT_SECRET:productionSecretKeyThatIsAtLeast256BitsLongForHS256AlgorithmSecurity}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# OpenAPI Documentation - enabled for testing
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Actuator for health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.defaults.enabled=true
management.endpoint.health.probes.enabled=true

# File Storage - MinIO via S3-compatible API
storage.type=${STORAGE_TYPE:s3}
storage.s3.endpoint=${STORAGE_S3_ENDPOINT:}
storage.s3.access-key=${STORAGE_S3_ACCESS_KEY:}
storage.s3.secret-key=${STORAGE_S3_SECRET_KEY:}
storage.s3.bucket=${STORAGE_S3_BUCKET:parsun-files}
storage.s3.region=${STORAGE_S3_REGION:us-east-1}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600