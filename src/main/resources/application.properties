spring.application.name=parsun

# Disable Docker Compose support (we use external docker compose)
spring.docker.compose.enabled=false

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/${DB_NAME:mydatabase}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:myuser}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:secret}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
# UUID Binary Support - Forces Hibernate to use BINARY(16) for UUID columns
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=BINARY
# Ensure Hibernate treats BINARY(16) as UUID
spring.jpa.properties.hibernate.type.wrapper_array_handling=ALLOW

# JWT Configuration
jwt.secret=${JWT_SECRET:defaultSecretKeyThatIsAtLeast256BitsLongForHS256AlgorithmSecurity}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# OpenAPI Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# File Storage Configuration
# Options: local, s3
storage.type=${STORAGE_TYPE:local}
storage.location=${STORAGE_LOCATION:/app/uploads}

# S3/MinIO Configuration (when storage.type=s3)
storage.s3.endpoint=${STORAGE_S3_ENDPOINT:http://minio:9000}
storage.s3.access-key=${STORAGE_S3_ACCESS_KEY:minioadmin}
storage.s3.secret-key=${STORAGE_S3_SECRET_KEY:minioadmin}
storage.s3.bucket=${STORAGE_S3_BUCKET:parsun-files}
storage.s3.region=${STORAGE_S3_REGION:us-east-1}

# Multipart Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
