# ──────────────────────────────────────────────
# Development profile — hot reload, verbose logs
# ──────────────────────────────────────────────

# Show SQL queries in console (useful for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Detailed logging for the application package
logging.level.com.parsun=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Show full error details (stack trace without ?trace=true)
server.error.include-stacktrace=always
server.error.include-message=always

# DevTools: restart on classpath changes
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/java
spring.devtools.restart.poll-interval=1s
spring.devtools.restart.quiet-period=400ms
spring.devtools.livereload.enabled=true
spring.devtools.livereload.port=35729
