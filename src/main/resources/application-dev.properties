# ──────────────────────────────────────────────
# Development profile — hot reload, verbose logs
# ──────────────────────────────────────────────

# SQL logging can be enabled temporarily with environment overrides when diagnosing queries
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:false}

# Detailed logging for the application package
logging.level.com.cashly=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.web=${SPRING_WEB_LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.orm.jdbc.bind=${HIBERNATE_BIND_LOG_LEVEL:WARN}

# Show full error details (stack trace without ?trace=true)
server.error.include-stacktrace=always
server.error.include-message=always

spring.flyway.validate-on-migrate=true

# DevTools: restart on classpath changes
spring.devtools.restart.enabled=false
spring.devtools.restart.poll-interval=1s
spring.devtools.restart.quiet-period=400ms
spring.devtools.livereload.enabled=true
spring.devtools.livereload.port=35729
